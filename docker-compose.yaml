version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    restart: unless-stopped
    networks:
      - ostad-network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_ROOT_USERNAME}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Web UI (Mongo Express)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongo
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ostad-network

  # Backend Node.js API
  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    image: ostad-server:${SERVER_IMAGE_VERSION}
    ports:
      - "5050:5050"
    volumes:
      - ./OstadServer:/ostad-server
      - /ostad-server/node_modules
    container_name: ostad-server
    environment:
      - MONGO_URI=${MONGO_URI}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ostad-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend React app (Vite dev)
  ui:
    build:
      context: .
      dockerfile: Dockerfile-UI
    image: ostad-ui:${UI_IMAGE_VERSION}
    ports:
      - "5173:5173"
    volumes:
      - ./OstadUI:/ostadui
      - /ostadui/node_modules
    container_name: ostad-ui
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ostad-network

networks:
  ostad-network:
    driver: bridge

volumes:
  mongo-data:
