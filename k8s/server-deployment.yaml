apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostad-server
  namespace: aninda-sarker-rahul-ns
  labels:
    app: ostad-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ostad-server
  template:
    metadata:
      labels:
        app: ostad-server
    spec:
      containers:
      - name: ostad-server
        # Note: You'll need to build and push this image to a registry
        # For local development, you can use: docker build -t ostad-server:latest -f Dockerfile-server .
        image: ostad-server:latest
        imagePullPolicy: Never  # Use local image for development
        ports:
        - containerPort: 5050
        env:
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: ostad-config
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            configMapKeyRef:
              name: ostad-config
              key: MONGO_PORT
        - name: MONGO_DATABASE
          valueFrom:
            configMapKeyRef:
              name: ostad-config
              key: MONGO_DATABASE
        - name: MONGO_AUTH_SOURCE
          valueFrom:
            configMapKeyRef:
              name: ostad-config
              key: MONGO_AUTH_SOURCE
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: ostad-secrets
              key: MONGO_ROOT_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ostad-secrets
              key: MONGO_ROOT_PASSWORD
        - name: MONGO_URI
          value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DATABASE)?authSource=$(MONGO_AUTH_SOURCE)"
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ostad-config
              key: SERVER_PORT
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 5050
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5050
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ostad-server
  namespace: aninda-sarker-rahul-ns
  labels:
    app: ostad-server
spec:
  selector:
    app: ostad-server
  ports:
  - port: 5050
    targetPort: 5050
  type: ClusterIP
