apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostad-ui
  namespace: aninda-sarker-rahul-ns
  labels:
    app: ostad-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ostad-ui
  template:
    metadata:
      labels:
        app: ostad-ui
    spec:
      containers:
      - name: ostad-ui
        # Production build with nginx
        image: ostad-ui-prod:latest
        imagePullPolicy: Never  # Use local image for development
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ostad-ui
  namespace: aninda-sarker-rahul-ns
  labels:
    app: ostad-ui
spec:
  selector:
    app: ostad-ui
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
