apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostad-ui
  namespace: pyro-ns
  labels:
    app: ostad-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ostad-ui
  template:
    metadata:
      labels:
        app: ostad-ui
    spec:
      containers:
      - name: ostad-ui
        # Note: You'll need to build and push this image to a registry
        # For local development, you can use: docker build -t ostad-ui:latest -f Dockerfile-UI .
        image: ostad-ui:latest
        imagePullPolicy: Never  # Use local image for development
        ports:
        - containerPort: 5173
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ostad-ui
  namespace: pyro-ns
  labels:
    app: ostad-ui
spec:
  selector:
    app: ostad-ui
  ports:
  - port: 5173
    targetPort: 5173
  type: ClusterIP
